tiles:
  - id: builder
    title: "Builder Docs"
    description: "Comprehensive developer documentation for Builder.io—APIs, SDKs, integration patterns, and in-product microcopy."
    image: "/images/tiles/builder.png"
    background: "#000"
    links:
      - label: "View Docs"
        url: "https://www.builder.io/c/docs/developers"

  - id: bazel
    title: "Bazel Docs"
    description: "Contributor to the Bazel docs migration. Generated versioned documentation for Bazel 9.1.0 and 8.7.0, plus contributor guides."
    image: "/images/tiles/bazel.png"
    background: "#ffffff"
    links:
      - label: "View Merged PRs"
        url: "https://github.com/bazelbuild/bazel/pulls?q=is%3Apr+author%3Akapunahelewong+is%3Aclosed"

  - id: aspect-python
    title: "Aspect: Python & JS + Bazel"
    description: "Comprehensive Python and JS documentation for Bazel, including migration guides, uv integration, virtual deps, interpreter configuration, and TypeScript."
    image: "/images/tiles/aspect-logo.png"
    background: "#161617"
    links:
      - label: "Python Docs"
        url: "https://aspect.build/docs/bazel/python"
      - label: "JavaScript Docs"
        url: "https://aspect.build/docs/bazel/javascript"

  - id: pepa
    title: "Pepa Docs Platform"
    description: "My pet project, an open-source documentation platform: MDX docs, full-text search, OpenAPI-powered API docs reference, and an MCP connector for AI agents."
    image: "/images/tiles/pepa.png"
    background: "#000"
    links:
      - label: "GitHub"
        url: "https://github.com/kapunahelewong/pepa"
      - label: "Live Demo"
        url: "https://kapunahelewong.github.io/pepa/"

  - id: github-api
    title: "GitHub API Explorer"
    description: "Static reference site rendering GitHub's ~1,200 REST endpoints, grouped by tag. Built by parsing the OpenAPI spec with Python."
    image: "/images/tiles/github-api.png"
    background: "#f6f7fb"
    links:
      - label: "GitHub"
        url: "https://github.com/kapunahelewong/explore-openapi"
      - label: "Live Demo"
        url: "https://kapunahelewong.github.io/explore-openapi/"

  - id: stripe-api
    title: "Stripe API Explorer"
    description: "Next.js static site built by parsing Stripe's OpenAPI spec. Renders paths, parameters, request and response schemas without Swagger UI or Redoc."
    image: "/images/tiles/stripe-api.png"
    background: "#000000"
    links:
      - label: "GitHub"
        url: "https://github.com/kapunahelewong/stripe-openapi-demo"
      - label: "Live Demo"
        url: "https://kapunahelewong.github.io/stripe-openapi-demo/"

  - id: angular
    title: "Angular Docs"
    description: "Official Angular docs and 70+ compilable sample applications. Fielded issues, contributed my own work, and helped PRs from the open-source community land."
    image: "/images/tiles/angular.png"
    background: "#000"
    links:
      - label: "View my PRs"
        url: "https://github.com/angular/angular/pulls?q=is%3Apr+author%3Akapunahelewong+is%3Aclosed"

  - id: ci-cd-tutorial
    title: "CI/CD in GitHub Actions"
    description: "Demo on how to use CI/CD"
    image: "/images/tiles/ci-cd-tutorial.png"
    background: "#000"
    links:
      - label: "Companion repo to my CI/CD blog series"
        url: "https://github.com/kapunahelewong/cd-cd-demo"
      - label: "Part 1 of series"
        url: "/posts/ci-cd-basics"

  - id: speaking-1
    title: "Legal liability and in-app copy"
    description: "Presentation for a law class at William & Mary's Law School about copy and legal liability in tech. Fall 2025."
    image: "/images/tiles/legal-talk.png"
    background: "#ffffff"
    links:
      - label: "Watch on YouTube"
        url: "https://youtu.be/hAKQmkwu9zM"

  - id: speaking-2
    title: "Want to see me live code?"
    description: "This is the Climbing up Injector Trees talk at Angular Connect with the amazing Uri Shaked. London, 2018."
    image: "/images/tiles/injector-trees.png"
    background: "#c8dfe5"
    links:
      - label: "Watch on YouTube"
        url: "https://youtu.be/F6rF16TmB0E?si=zzglmmkMcMtRdzq_&t=190"
